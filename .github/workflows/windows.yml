name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Build portable executable
        run: .\build.ps1
      - name: Read package version
        id: package
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq 'world-clock').version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable package version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WorldClock-v${{ steps.package.outputs.version }}
          path: |
            dist/WorldClock-v${{ steps.package.outputs.version }}.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WorldClock-v${{ needs.build.outputs.version }}
          path: dist
      - name: Publish a new package version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $tag = "v$env:PACKAGE_VERSION"
          $executableName = "WorldClock-v$env:PACKAGE_VERSION.exe"
          $executablePath = Join-Path 'dist' $executableName
          if (-not (Test-Path -LiteralPath $executablePath)) { throw "Missing release asset: $executableName" }
          $expectedChecksum = "{0}  {1}" -f (Get-FileHash -LiteralPath $executablePath -Algorithm SHA256).Hash.ToLowerInvariant(), $executableName
          if ((Get-Content -LiteralPath 'dist/SHA256SUMS.txt' -Raw).Trim() -cne $expectedChecksum) { throw 'Release checksum does not match the executable.' }
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving it unchanged."
            exit 0
          }
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw -Encoding utf8
          $versionPattern = [regex]::Escape($env:PACKAGE_VERSION)
          $entry = [regex]::Match($changelog, "(?ms)^## $versionPattern[^\r\n]*\r?\n(?<notes>.*?)(?=^## |\z)")
          if (-not $entry.Success) { throw "Missing changelog entry for $env:PACKAGE_VERSION." }
          $changes = $entry.Groups['notes'].Value.Trim()
          @"
          ## What's new

          $changes

          ## Download

          Portable World Clock for 64-bit Windows 10/11.

          Download **$executableName** below and run it. No installation or extra runtime is required.
          Settings are stored per user in the Windows registry.

          Versions before 0.4.1 require a one-time manual download to gain in-app updates. Later updates can be downloaded and installed from Settings or the tray menu.

          See [README](https://github.com/$env:GH_REPO/blob/$env:GITHUB_SHA/README.md) for screenshots and usage, and [CHANGELOG](https://github.com/$env:GH_REPO/blob/$env:GITHUB_SHA/CHANGELOG.md) for changes.
          SHA256SUMS.txt contains the SHA-256 checksum of the executable.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release create $tag $executablePath 'dist/SHA256SUMS.txt' --target $env:GITHUB_SHA --title "World Clock $env:PACKAGE_VERSION" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
