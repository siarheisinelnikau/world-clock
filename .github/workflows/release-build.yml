name: Checked release builds
'on':
  workflow_call: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Provision shared updater source
      shell: pwsh
      run: ./scripts/provision-shared-updater.ps1
    - name: Set up stable Rust
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        rustup default stable
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Check formatting
      run: cargo fmt --check
    - name: Run Clippy
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Run tests
      run: cargo test --locked
    - name: Build portable executable
      run: .\build.ps1
    - name: Read package version
      id: package
      run: |
        $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $version = ($metadata.packages | Where-Object name -eq 'world-clock').version
        if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable package version.' }
        "version=$version" >> $env:GITHUB_OUTPUT
    - name: Upload Windows build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: WorldClock-v${{ steps.package.outputs.version }}
        path: |
          dist/WorldClock-v${{ steps.package.outputs.version }}.exe
          dist/SHA256SUMS.txt
        if-no-files-found: error
        retention-days: 14
    permissions:
      contents: read
defaults:
  run:
    shell: pwsh
