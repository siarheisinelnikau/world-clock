[package]
name = "world-clock"
version = "0.4.2"
edition = "2024"
description = "Portable Windows world clock with customizable desktop widgets and taskbar time zones"
repository = "https://github.com/siarheisinelnikau/world-clock"
readme = "README.md"
license = "MIT"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = ["Win32_UI_Accessibility", "Win32_System_Com"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Time",
    "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls_Dialogs",
    "Win32_UI_Accessibility",
    "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
